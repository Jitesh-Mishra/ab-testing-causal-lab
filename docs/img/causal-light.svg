<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 470" width="1090" height="470" role="img" aria-label="Causal diagram: random assignment instruments ad exposure; user intent confounds exposure and outcome; advertiser drives both treatment ratio and features."><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker></defs><rect width="1090" height="470" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2328" text-anchor="start">What is randomized, what is not</text><text x="32" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Only the assignment is random. Exposure is chosen by the ad auction, and the pooled split varies by advertiser.</text><rect x="55.0" y="218.0" width="190" height="64" rx="12" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.8"/><text x="150" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1f2328" text-anchor="middle">assignment T</text><text x="150" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">85 / 15, random within a test</text><rect x="375.0" y="218.0" width="190" height="64" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.8"/><text x="470" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1f2328" text-anchor="middle">exposure D</text><text x="470" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">3.6% of treated see an ad</text><rect x="695.0" y="218.0" width="190" height="64" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.8"/><text x="790" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1f2328" text-anchor="middle">visit / conversion Y</text><text x="790" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">outcome</text><rect x="525.0" y="96.0" width="210" height="58" rx="12" fill="#fde8de" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="5 4"/><text x="630" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1f2328" text-anchor="middle">user intent</text><text x="630" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">unobserved</text><rect x="45.0" y="366.0" width="210" height="58" rx="12" fill="#fde8de" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="5 4"/><text x="150" y="393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1f2328" text-anchor="middle">advertiser / test</text><text x="150" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">unobserved in the data</text><rect x="375.0" y="366.0" width="190" height="58" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.8"/><text x="470" y="393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1f2328" text-anchor="middle">features X (f0..f11)</text><text x="470" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#59636e" text-anchor="middle">advertiser-dependent</text><line x1="245" y1="250" x2="371" y2="250" stroke="#59636e" stroke-width="2" marker-end="url(#g)"/><text x="308" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle">instrument</text><line x1="565" y1="250" x2="691" y2="250" stroke="#1baf7a" stroke-width="2" marker-end="url(#c)"/><text x="628" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1baf7a" text-anchor="middle">effect we want</text><line x1="590" y1="154" x2="520" y2="216" stroke="#eb6834" stroke-width="2" marker-end="url(#b)"/><text x="528" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#eb6834" text-anchor="middle">auction targets</text><line x1="670" y1="154" x2="750" y2="216" stroke="#eb6834" stroke-width="2" marker-end="url(#b)"/><text x="760" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#eb6834" text-anchor="middle">intent drives Y</text><line x1="150" y1="366" x2="150" y2="286" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/><text x="205" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#eb6834" text-anchor="middle">treatment ratio</text><line x1="255" y1="395" x2="371" y2="395" stroke="#eb6834" stroke-width="2" marker-end="url(#b)"/><line x1="565" y1="380" x2="720" y2="285" stroke="#59636e" stroke-width="2" marker-end="url(#g)"/><text x="680" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#59636e" text-anchor="middle">X predicts Y</text><rect x="900" y="104" width="160" height="96" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="912" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#1f2328" text-anchor="start">Naive exposed vs</text><text x="912" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">unexposed mixes the</text><text x="912" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">ad effect with intent</text><text x="912" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#eb6834" text-anchor="start">→ 1.4 to 1.9x too big</text><rect x="900" y="330" width="160" height="110" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="912" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#1f2328" text-anchor="start">Pooled split is not</text><text x="912" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">balanced on X: adjust</text><text x="912" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">for X (Lin, CUPAC,</text><text x="912" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">AIPW) before trusting</text><text x="912" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#eb6834" text-anchor="start">the lift</text></svg>